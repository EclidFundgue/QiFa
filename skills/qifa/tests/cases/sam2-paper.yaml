name: sam2-paper
mode: development
input:
  paper: https://arxiv.org/abs/2408.00714
config:
  language: zh-CN
  duration: 45
  visual_style: scientific-editorial
  depth: deep
  audience: 具备深度学习与计算机视觉基础、想理解 SAM 2 方法并能讲给别人听的研究生与工程师
